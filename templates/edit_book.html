<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ book['title'] }} | Libra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_book.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Menu -->
    <nav>
        <a href="{{ url_for('admin_dashboard') }}" class="nav-brand">
            <i class="fas fa-book-open"></i> Library Admin
        </a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Edit Book</h1>
        </div>

        <form id="editBookForm" class="edit-form" action="{{ url_for('edit_book', book_id=book['_id']) }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ book['title'] }}" required>
            </div>

            <div class="form-group">
                <label for="author" class="form-label">Author</label>
                <input type="text" id="author" name="author" class="form-control" value="{{ book['author'] }}" required>
            </div>

            <div class="form-group">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="{{ book['category'] }}" selected>{{ book['category'] }}</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Non-fiction">Non-fiction</option>
                    <option value="Science">Science</option>
                    <option value="Biography">Biography</option>
                    <option value="History">History</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" name="description" class="form-control" rows="5" required>{{ book['description'] }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Book File (.epub, .docx, .txt)</label>
                <div class="file-upload">
                    <div class="file-upload-btn">
                        <i class="fas fa-cloud-upload-alt"></i> Choose New File
                    </div>
                    <input type="file" id="file" name="file" class="file-upload-input" accept=".epub,.docx,.txt">
                </div>
                <div id="bookFileName" class="file-name" data-current="{{ book['file'] or 'No file' }}">
                    Current file: {{ book['file'] or 'No file' }}
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Cover Image (.jpg, .png)</label>
                <div class="file-upload">
                    <div class="file-upload-btn">
                        <i class="fas fa-cloud-upload-alt"></i> Choose New Image
                    </div>
                    <input type="file" id="image" name="image" class="file-upload-input" accept=".jpg,.png">
                </div>
                
                <div id="imageFileName" class="file-name" data-current="{{ book['image'] or 'No image' }}">
                    Current image: {{ book['image'] or 'No image' }}
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Update Book
            </button>
            
            <a href="{{ url_for('manage_book') }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Cancel
            </a>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 class="modal-title">Success!</h3>
            <p class="modal-message">Book updated successfully</p>
            <button id="closeModal" class="btn btn-close">Close</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p class="footer-text">&copy; 2024 Library Management System. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById("successModal");
            const closeModalButton = document.getElementById("closeModal");
            const bookFileInput = document.getElementById("file");
            const bookFileName = document.getElementById("bookFileName");
            const imageFileInput = document.getElementById("image");
            const imageFileName = document.getElementById("imageFileName");

            // Handle file input changes
            bookFileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    bookFileName.textContent = 'New file: ' + this.files[0].name;
                } else {
                    bookFileName.textContent = 'Current file: ' + bookFileName.dataset.current;
                }
            });

            imageFileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    imageFileName.textContent = 'New image: ' + this.files[0].name;
                } else {
                    imageFileName.textContent = 'Current image: ' + imageFileName.dataset.current;
                }
            });

            // Handle form submission
            document.getElementById("editBookForm").addEventListener("submit", function(e) {
                e.preventDefault();
                
                // Show loading state
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
                submitBtn.disabled = true;

                // Simulate update process
                setTimeout(() => {
                    // Show success modal
                    modal.classList.add('show');
                    
                    // Submit the form after showing the modal
                    setTimeout(() => {
                        this.submit();
                    }, 1500);
                }, 1000);
            });

            // Close modal
            closeModalButton.addEventListener('click', function() {
                modal.classList.remove('show');
            });

            // Close when clicking outside
            window.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Libra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Recovery Container -->
    <div class="recovery-container">
        <div class="recovery-header">
            <div class="logo">
                <i class="fas fa-book-open logo-icon"></i>
                <span class="logo-text">Libra</span>
            </div>
            <h2>Reset Your Password</h2>
            <p>Enter your email to receive a verification code</p>
        </div>

        <form id="forgot-form" method="POST" action="{{ url_for('forgot_password') }}" class="recovery-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Your registered email" required>
                </div>
            </div>

            <button type="submit" class="recovery-btn">
                <i class="fas fa-paper-plane"></i> Send Verification Code
            </button>

            <div class="login-link">
                Remember your password? <a href="{{ url_for('login') }}">Sign in here</a>
            </div>
        </form>
    </div>

    <!-- Hidden message container -->
    <div id="popup" class="popup" 
         data-category="{{ category }}" 
         data-message="{{ message }}">
    </div>

    <script>
        // Popup functionality
        window.onload = () => {
            const popup = document.getElementById("popup");
            const category = popup.getAttribute("data-category");
            const message = popup.getAttribute("data-message");

            if (message && category) {
                if (message == "None") {
                    popup.textContent = "";
                }
                else {
                    popup.textContent = message;
                }
                popup.classList.add(category);
                popup.style.display = "block";

                setTimeout(() => {
                    popup.style.display = "";
                }, 3000);
            }
        };
    </script>
</body>
</html>

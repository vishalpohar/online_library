<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Libra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset_password.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Reset Container -->
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo">
                <i class="fas fa-book-open logo-icon"></i>
                <span class="logo-text">Libra</span>
            </div>
            <h2>Create New Password</h2>
            <p>Choose a strong password to secure your account</p>
        </div>

        <form id="reset-password-form" method="POST" action="{{ url_for('reset_password') }}" class="reset-form">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Enter new password" required>
                </div>
                <div class="password-strength">
                    <div class="strength-meter" id="strength-meter"></div>
                </div>
                <div class="password-hint">Use at least 8 characters with a mix of letters, numbers & symbols</div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>
            </div>

            <button type="submit" class="reset-btn">
                <i class="fas fa-sync-alt"></i> Reset Password
            </button>

            <div class="login-link">
                Remember your password? <a href="{{ url_for('login') }}">Sign in here</a>
            </div>
        </form>
    </div>

    <!-- Hidden message container -->
    <div id="popup" class="popup" 
         data-category="{{ category }}" 
         data-message="{{ message }}">
    </div>

    <script>
        // Password strength indicator
        const passwordInput = document.getElementById('new_password');
        const strengthMeter = document.getElementById('strength-meter');
        const confirmPasswordInput = document.getElementById('confirm_password');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            // Check length
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;
            
            // Check for numbers
            if (/\d/.test(password)) strength += 1;
            
            // Check for special chars
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength += 1;
            
            // Check for uppercase and lowercase
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;
            
            // Update meter
            const width = strength * 20;
            strengthMeter.style.width = width + '%';
        });

        // Form validation
        const form = document.getElementById('reset-password-form');
        form.addEventListener('submit', function(e) {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Passwords do not match!');
            }
        });

        // Popup functionality
        window.onload = () => {
            const popup = document.getElementById("popup");
            const category = popup.getAttribute("data-category");
            const message = popup.getAttribute("data-message");

            if (message && category) {
                popup.textContent = message;
                popup.classList.add(category);
                popup.style.display = "block";

                setTimeout(() => {
                    popup.style.display = "none";
                    if (category === "success") {
                        window.location.href = "/login";
                    }
                }, 3000);
            }
        };
    </script>
</body>
</html>
